name: Matrix Build with Artifacts

# Allow manual triggering (and run on push)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # run each matrix job on Ubuntu; we build for multiple Node versions here
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [14, 16, 18]   # ← three variants (minimum 3)
        include:
          - node-version: 14
          - node-version: 16
          - node-version: 18

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: matrix-3a6c947
        id: matrix_step
        run: |
          echo "Running matrix job for node version: ${{ matrix.node-version }}"
          echo "matrix identifier present: matrix-3a6c947"

      - name: Create artifact content (JSON)
        run: |
          # Create a unique artifact file per matrix variant
          ARTFILE="build-output-${{ matrix.node-version }}.json"
          echo "{" > $ARTFILE
          echo "  \"variant\": \"node-${{ matrix.node-version }}\"," >> $ARTFILE
          echo "  \"timestamp\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"," >> $ARTFILE
          echo "  \"note\": \"Build artifact for node ${{ matrix.node-version }}\"" >> $ARTFILE
          echo "}" >> $ARTFILE
          # show the file so it's easy to debug in logs
          cat $ARTFILE
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # artifact name must start with required prefix
          name: build-3a6c947-${{ matrix.node-version }}
          path: build-output-${{ matrix.node-version }}.json
